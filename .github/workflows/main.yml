name: Build and Deploy
on:
  push:
    branches: [ "main" ] # Triggers the workflow on push events to the main branch

jobs:
  build: # A job named "build"
    runs-on: ubuntu-latest # The runner environment (GitHub-hosted)
    steps:
    - uses: actions/checkout@v4 # Checks out your repository
    - name: Run a one-line script
      run: echo Hello, world! # Runs a single command
